/* =========================================================

const W = 960, H = 540;
const FT = 440;          // floor top
const FY = 470;          // feet line
const AX0 = 130;         // assassin start x
const MAXL = 640;        // lunge distance at power = 1
const REACH = 100;       // stand-off distance from the mark when snatching

const CHARGE_RATE = 0.56; // power per second
const MAXP = 1.12;

const cv = document.getElementById('c');
let DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
const ctx = cv.getContext('2d');

const TITLE_FONT = "'Uncial Antiqua','Cinzel','Trajan Pro',Georgia,serif";
const FONT_EN = TITLE_FONT, FONT_VI = "'Alfa Slab One',Georgia,'Times New Roman',serif";   // Uncial Antiqua has no Vietnamese letters
let FONT = LANG === 'vi' ? FONT_VI : FONT_EN;
const INK = '#1b1519';
const rnd = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);

/* ---------------- levels ---------------- */
const LEVELS = [
  { name: 'The King', scene: 'throne', kind: 'king', sit: true, dist: 380, tol: 48,

  { name: 'The General', scene: 'war', kind: 'general', dist: 520, tol: 30,
    away: [1.8, 3.2], warn: .45, look: 1.0, hint: 2,

/* ---------------- sound ---------------- */
let AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'square', vol = .07, slide = 0, delay = 0) {
  const a = ac(); if (!a || muted) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d + .02);
}
function noise(d, vol, fc) {
  const a = ac(); if (!a || muted) return;
  const n = (a.sampleRate * d) | 0, b = a.createBuffer(1, n, a.sampleRate), dt = b.getChannelData(0);
  for (let i = 0; i < n; i++) dt[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(); s.buffer = b;
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fc;
  const g = a.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
const sfx = {
  steal() { noise(.12, .25, 3000); tone(988, .09, 'square', .07); tone(1319, .35, 'square', .07, 0, .09); },
  caught() { tone(420, .5, 'sawtooth', .1, -320); tone(210, .6, 'square', .07, -120, .1); },
  slip() { tone(190, .18, 'square', .08, -70); },
  warn(hi) { tone(hi ? 900 : 640, .09, 'sine', .05); },
  squawk() { tone(1000, .18, 'sawtooth', .06, -500); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .18, 'triangle', .09, 0, i * .11)); },
  start() { tone(330, .1, 'triangle', .07); tone(494, .14, 'triangle', .07, 0, .08); },
};

/* ---------------- drawing helpers ---------------- */
function fillStroke(fill, lw = 3) {
  ctx.fillStyle = fill; ctx.fill();
  if (lw > 0) { ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
}
function poly(pts, fill, lw) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); fillStroke(fill, lw);
}
function circ(x, y, r, fill, lw) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); fillStroke(fill, lw); }
function ell(x, y, rx, ry, fill, lw, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, Math.PI * 2); fillStroke(fill, lw); }
function rect(x, y, w, h, fill, lw) { ctx.beginPath(); ctx.rect(x, y, w, h); fillStroke(fill, lw); }
function rrect(x, y, w, h, r, fill, lw) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); fillStroke(fill, lw); }
function line(x1, y1, x2, y2, w, col) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = INK; ctx.lineWidth = w + 6;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function plain(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function shadow(x, y, rx) { ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(x, y, rx, rx * .16, 0, 0, 7); ctx.fill(); }
function vgrad(y0, y1, c0, c1) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, c0); g.addColorStop(1, c1); return g; }
function text(s, x, y, size, fill, o = {}) {
  ctx.font = `${size}px ${o.font || FONT}`; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.shadow) { ctx.fillStyle = o.shadow; ctx.fillText(s, x + (o.sdx || 3), y + (o.sdy || 4)); }
  if (o.stroke) { ctx.lineWidth = o.sw || size * .16; ctx.strokeStyle = o.stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}

/* two-bone IK: returns [kneeX, kneeY, endX, endY] */
function ik(x0, y0, x1, y1, l1, l2, s) {
  let dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy) || .001;
  const maxd = l1 + l2 - .01;
  if (d > maxd) { const k = maxd / d; dx *= k; dy *= k; d = maxd; x1 = x0 + dx; y1 = y0 + dy; }
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const mx = x0 + dx * a / d, my = y0 + dy * a / d;
  return [mx - s * dy * h / d, my + s * dx * h / d, x1, y1];
}

/* ---------------- assassin ---------------- */
const POSE = {
  idle:   { hx: 0, hy: -92, lean: .08, fF: [16, 0], fB: [-16, 0], hF: [24, 40], hB: [-16, 42], ka: .9, esF: 1, esB: 1 },
  charge: { hx: -34, hy: -84, lean: -.5, fF: [26, -16], fB: [-40, 0], hF: [-36, 10], hB: [26, -6], ka: 0, esF: -1, esB: 1 },
  lunge:  { hx: 30, hy: -76, lean: .6, fF: [84, -4], fB: [-26, 0], hF: [40, 38], hB: [-34, 26], ka: 0, esF: 1, esB: 1 },
  grab:   { hx: 8, hy: -88, lean: .36, fF: [40, 0], fB: [-22, 0], hF: [36, 60], hB: [-14, 40], ka: 0, esF: 1, esB: 1 },
  cheer:  { hx: 0, hy: -92, lean: -.06, fF: [16, 0], fB: [-16, 0], hF: [26, -62], hB: [-22, -62], ka: 0, esF: -1, esB: -1 },
  stumble:{ hx: 52, hy: -56, lean: 1.0, fF: [74, 0], fB: [-6, -10], hF: [50, 44], hB: [44, 40], ka: 1.2, esF: 1, esB: 1 },
  caught: { hx: 0, hy: -92, lean: -.06, fF: [16, 0], fB: [-16, 0], hF: [22, -64], hB: [-22, -64], ka: -1.6, esF: -1, esB: -1 },
};
const clonePose = p => JSON.parse(JSON.stringify(p));
function mixPose(a, b, t) {
  const o = {};
  for (const k in a) o[k] = Array.isArray(a[k]) ? a[k].map((v, i) => lerp(v, b[k][i], t)) : lerp(a[k], b[k], t);
  return o;
}
function approach(cur, tgt, k) {
  for (const key in tgt) {
    if (Array.isArray(tgt[key])) for (let i = 0; i < tgt[key].length; i++) cur[key][i] += (tgt[key][i] - cur[key][i]) * k;
    else cur[key] += (tgt[key] - cur[key]) * k;
  }
}

/* limb with a soft highlight so shapes look rounded */
function limb(x1, y1, x2, y2, w, col) {
  line(x1, y1, x2, y2, w, col);
  ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = Math.max(2, w * .28);
  ctx.beginPath(); ctx.moveTo(x1 - w * .18, y1 - w * .2); ctx.lineTo(x2 - w * .18, y2 - w * .2); ctx.stroke(); ctx.restore();
}
function shoe(x, y, col = '#5b3a22') {
  ctx.beginPath(); ctx.moveTo(x - 9, y - 12); ctx.lineTo(x + 5, y - 12);
  ctx.quadraticCurveTo(x + 8, y - 4, x + 20, y - 4); ctx.quadraticCurveTo(x + 30, y - 3, x + 28, y + 3);
  ctx.lineTo(x - 9, y + 4); ctx.closePath(); fillStroke(col, 2.6);
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(x - 8, y + 1, 35, 3);
  ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.beginPath(); ctx.ellipse(x + 14, y - 5.5, 7, 1.6, 0, 0, 7); ctx.fill();
}
function drawAssassin(x, P, mood, t) {
  ctx.save(); ctx.translate(x, FY);
  shadow(0, 2, 54);
  const SHIRT = '#e6e3ee', JACK = '#2c2f4a', PANT = '#3d425f', SKIN = '#ecd2ab', GLOVE = '#7a4e2a';
  const hip = [P.hx, P.hy];
  const sh = [hip[0] + Math.sin(P.lean) * 60, hip[1] - Math.cos(P.lean) * 60];
  const hd = [sh[0] + Math.sin(P.lean * 1.15) * 32, sh[1] - Math.cos(P.lean * 1.15) * 32];
  const leg = (f) => {
    const k = ik(hip[0], hip[1], f[0], f[1], 48, 50, -1);
    limb(hip[0], hip[1], k[0], k[1], 16, PANT); limb(k[0], k[1], k[2], k[3], 13, PANT);
    rrect(k[0] - 5, k[1] - 5, 10, 10, 2, '#7d6aa8', 1.8);       // knee patch
    shoe(k[2], k[3]);
  };
  const arm = (h, es, col) => {
    const k = ik(sh[0], sh[1], sh[0] + h[0], sh[1] + h[1], 38, 38, es);
    limb(sh[0], sh[1], k[0], k[1], 12, col); limb(k[0], k[1], k[2], k[3], 11, col);
    circ(k[2], k[3], 7.5, GLOVE, 2.5); circ(k[2] + 4, k[3] - 4, 3.4, GLOVE, 2);
    return [k[2], k[3]];
  };
  leg(P.fB);
  arm(P.hB, P.esB, JACK);
  // loot sack on the back
  { const sxp = sh[0] - 24 - Math.cos(P.lean) * 2, syp = sh[1] + 20;
    ctx.save(); ctx.translate(sxp, syp); ctx.rotate(-.3 + P.lean * .4);
    poly([[-8, -20], [8, -20], [13, -32], [0, -27], [-13, -32]], '#c29a62', 2.8);
    ell(0, 0, 19, 24, '#c29a62', 3); ell(-6, -4, 5, 11, 'rgba(255,255,255,.2)', 0);
    line(-8, -19, 8, -19, 3.4, '#6b4a2b');
    text('$', 1, 5, 22, '#5c4326');
    ctx.restore(); }
  // torso: striped shirt + belt + neckerchief
  limb(hip[0], hip[1], sh[0], sh[1], 36, SHIRT);
  ctx.strokeStyle = JACK; ctx.lineWidth = 4; ctx.lineCap = 'butt';
  const px0 = Math.cos(P.lean) * 16, py0 = Math.sin(P.lean) * 16;
  for (let i = 0; i < 4; i++) {
    const f = .28 + i * .2, px = lerp(hip[0], sh[0], f), py = lerp(hip[1], sh[1], f);
    ctx.beginPath(); ctx.moveTo(px - px0, py - py0); ctx.lineTo(px + px0, py + py0); ctx.stroke();
  }
  { const bx = lerp(hip[0], sh[0], .1), by = lerp(hip[1], sh[1], .1);
    ctx.save(); ctx.lineCap = 'butt'; ctx.strokeStyle = INK; ctx.lineWidth = 11; ctx.beginPath(); ctx.moveTo(bx - px0 * 1.1, by - py0 * 1.1); ctx.lineTo(bx + px0 * 1.1, by + py0 * 1.1); ctx.stroke();
    ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 6; ctx.stroke(); ctx.restore();
    rrect(bx - 5, by - 5, 10, 10, 2, '#f0c231', 2.2); }
  poly([[sh[0] - 11, sh[1] - 3], [sh[0] + 11, sh[1] - 5], [sh[0] + 5, sh[1] + 15]], '#d6453d', 2.6);
  leg(P.fF);
  // head
  ctx.save(); ctx.translate(hd[0], hd[1]); ctx.rotate(P.lean * .55);
  const scared = mood === 'caught', happy = mood === 'win', sly = mood === 'charge';
  ell(-17, 7, 9, 14, '#3a2a1f', 2.5, .2);
  circ(-16, 4, 5.5, SKIN, 2.5);
  ell(0, 0, 23, 24.5, SKIN, 3);

/* ---------------- state ---------------- */
let mode = 'menu', modeT = 0, T = 0;
let lvIdx = 0, L = LEVELS[0], victim = null, guards = [], watchers = [];
let ax = AX0, power = 0, aState = 'idle', aT = 0, lungeFrom = 0, lungeTo = 0, lungeDur = .2, lungeKind = '', trail = [];
let slips = 0, shake = 0, flash = 0, flashCol = '255,40,40', caughtMsg = '';
let stars = [], everCharged = false, parts = [], pops = [], loot = null;
const AP = clonePose(POSE.idle);

function mkWatcher(o, t) { return { kind: o.kind, x: o.x, away: o.away, warn: o.warn, look: o.look, state: 'away', t, turn: 0, dead: false, slump: 0, sit: false }; }
function setup(i) {
  lvIdx = i; L = LEVELS[i]; VX = AX0 + L.dist + REACH;
  victim = mkWatcher({ kind: L.kind, x: VX, away: L.away, warn: L.warn, look: L.look }, rnd(1.5, 2.6));
  victim.sit = !!L.sit;
  guards = L.guards.map(g => mkWatcher(g, rnd(2, 3.6)));
  watchers = [victim, ...guards];
  ax = AX0; power = 0; aState = 'idle'; aT = 0; slips = 0; trail = []; parts = []; pops = []; loot = null;
  flash = 0; shake = 0;
  Object.assign(AP, clonePose(POSE.idle));
}
function startLevel(i, quick) { setup(i); mode = quick ? 'play' : 'intro'; modeT = 0; if (!quick) sfx.start(); }
function nextLevel() { if (lvIdx + 1 < LEVELS.length) startLevel(lvIdx + 1); else { mode = 'end'; modeT = 0; sfx.win(); } }
const isLooking = w => !w.dead && w.state === 'look';

function updWatcher(w, dt) {
  if (w.dead) return;
  w.t -= dt;
  let target = 0;
  if (w.state === 'away') {
    if (w.t <= 0) { w.state = 'warn'; w.t = w.warn; sfx.warn(w.kind === 'parrot'); }
  } else if (w.state === 'warn') {
    target = .38 + Math.sin(T * 30) * .06;
    if (w.t <= 0) { w.state = 'look'; w.t = w.look; if (w.kind === 'parrot') { sfx.squawk(); pops.push({ s: TX('squawk'), x: w.x, y: FY - 230, t: .9, col: '#7fe08a', size: 24 }); } }
  } else if (w.state === 'look') {
    target = 1;
    if (w.t <= 0) { w.state = 'away'; w.t = rnd(w.away[0], w.away[1]); }
  }
  w.turn += (target - w.turn) * Math.min(1, dt * (w.state === 'look' ? 20 : 10));
}

function coins(x, y, n) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rnd(-170, 260), vy: rnd(-560, -220), r: rnd(4, 7), life: 1.5 });
}

function caught(msg) {
  if (mode !== 'play') return;
  mode = 'caught'; modeT = 0; caughtMsg = msg; aState = 'caught'; power = 0;
  shake = 10; flash = 1; flashCol = '255,40,40'; sfx.caught();
  watchers.forEach(w => { if (!w.dead) { w.state = 'look'; w.t = 99; } });
  pops.push({ s: '!!!', x: victim.x, y: FY - 290, t: 1.2, col: '#ff4040', size: 56 });
}

function doRelease() {
  const p = power; power = 0;
  if (p < .03) { aState = 'idle'; return; }              // quick tap = cancel
  if (watchers.some(isLooking)) { caught(TX('lookedAt')); return; }
  const land = ax + p * MAXL, target = victim.x - REACH;
  aState = 'lunge'; aT = 0; lungeFrom = ax; trail = [];
  if (Math.abs(land - target) <= L.tol) { lungeKind = 'kill'; lungeTo = land; lungeDur = .2; }
  else if (land < target) {
    lungeKind = 'slip'; lungeTo = land; lungeDur = Math.max(.12, Math.min(.22, (land - ax) / 2600));
    slips++; sfx.slip();
    if (victim.state === 'away') { victim.state = 'warn'; victim.t = .3; sfx.warn(false); }
  } else { lungeKind = 'over'; lungeTo = Math.min(land, victim.x - 40); lungeDur = .2; }
}
function lungeEnd() {
  ax = lungeTo;
  if (lungeKind === 'kill') {
    victim.stolen = true; mode = 'stealing'; modeT = 0; aState = 'grab'; aT = 0;
    loot = { kind: L.kind, t: 0, x0: victim.x - 34, y0: FY - (victim.sit ? 76 : 90) };
    coins(loot.x0, loot.y0, 22); shake = 4; flash = .35; flashCol = '255,224,120'; sfx.steal();
    pops.push({ s: '+ ' + lootName(L.kind).toUpperCase() + '!', x: ax + 60, y: FY - 310, t: 1.7, col: '#ffd23f', size: 28 });
    stars[lvIdx] = slips === 0 ? 3 : slips === 1 ? 2 : 1;
  } else if (lungeKind === 'slip') {
    aState = 'stumble'; aT = 0;
    pops.push({ s: TX('tooShort'), x: ax, y: FY - 250, t: 1, col: '#ffd23f', size: 26 });
  } else caught(TX('overshot'));
}

function press() {
  ac();
  switch (mode) {
    case 'menu': startLevel(0); break;
    case 'play': if (aState === 'idle') { aState = 'charge'; power = 0; everCharged = true; tone(260, .06, 'triangle', .05); } break;
    case 'clear': if (modeT > .6) nextLevel(); break;
    case 'caught': if (modeT > .7) startLevel(lvIdx, true); break;
    case 'end': if (modeT > 1) { stars = []; setup(0); mode = 'menu'; } break;
  }
}
function release() { if (mode === 'play' && aState === 'charge') doRelease(); }
function cancelCharge() { if (mode === 'play' && aState === 'charge') { aState = 'idle'; power = 0; } }

addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) press(); }
  else if (e.code === 'KeyM') muted = !muted;
  else if (e.code === 'KeyR' && (mode === 'play' || mode === 'caught')) startLevel(lvIdx, true);
  else if (e.code === 'Escape') { stars = []; setup(0); mode = 'menu'; }
});
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); release(); } });
cv.addEventListener('pointerdown', e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {} press(); });
cv.addEventListener('pointerup', e => { e.preventDefault(); release(); });
cv.addEventListener('pointercancel', cancelCharge);
addEventListener('blur', cancelCharge);
document.addEventListener('visibilitychange', () => { if (document.hidden) cancelCharge(); });
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------- update ---------------- */
function targetPose() {
  let o;
  switch (aState) {
    case 'charge': {
      o = mixPose(POSE.idle, POSE.charge, clamp(power * 6, 0, 1));
      const k = clamp(power, 0, 1.1);
      o.lean = lerp(o.lean, -.62, k); o.hx = lerp(o.hx, -44, k);
      const sh = power > .8 ? (power - .8) * 9 : power * 1.2;
      o.hx += Math.sin(T * 60) * sh * .35; o.hy += Math.cos(T * 53) * sh * .25;
      return o;
    }
    case 'lunge': return POSE.lunge;
    case 'grab': return POSE.grab;
    case 'cheer': return POSE.cheer;
    case 'stumble': return POSE.stumble;
    case 'caught': return POSE.caught;
    default: o = clonePose(POSE.idle); o.hy += Math.sin(T * 3) * 1.5; o.lean += Math.sin(T * 1.5) * .02; return o;
  }
}
function update(dt) {
  T += dt; modeT += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 40);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.vy += 1500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.y > FY + 20 || p.life <= 0) parts.splice(i, 1);
  }
  if (loot) loot.t += dt;
  for (let i = pops.length - 1; i >= 0; i--) { const p = pops[i]; p.t -= dt; p.y -= 28 * dt; if (p.t <= 0) pops.splice(i, 1); }

  if (mode === 'menu') watchers.forEach(w => updWatcher(w, dt));
  if (mode === 'play') {
    watchers.forEach(w => updWatcher(w, dt));
    if (aState === 'charge') {
      const prev = power; power = Math.min(MAXP, power + dt * CHARGE_RATE);
      if (Math.floor(prev * 14) !== Math.floor(power * 14)) tone(220 + power * 520, .05, 'triangle', .04);
      if (watchers.some(isLooking)) caught(TX('turned'));
    }
  }
  if (mode === 'intro' && modeT > 1.6) { mode = 'play'; modeT = 0; }
  if (mode === 'stealing') {
    watchers.forEach(w => { w.turn += (0 - w.turn) * Math.min(1, dt * 10); });
    if (modeT > 1.7) { mode = 'clear'; modeT = 0; sfx.win(); }
  }
  if (mode === 'caught') guards.concat(victim).forEach(w => { w.turn += (1 - w.turn) * Math.min(1, dt * 20); });

  if (aState === 'lunge') {
    aT += dt; trail.push(ax); if (trail.length > 7) trail.shift();
    const k = Math.min(1, aT / lungeDur); ax = lerp(lungeFrom, lungeTo, easeOut(k));
    if (k >= 1) lungeEnd();
  } else if (aState === 'stumble') { aT += dt; if (aT > .7) aState = 'idle'; }
  else if (aState === 'grab') { aT += dt; if (aT > .4) aState = 'cheer'; }
  else if (trail.length) trail.shift();

  const rate = aState === 'lunge' ? 45 : aState === 'charge' ? 16 : 11;
  approach(AP, targetPose(), 1 - Math.exp(-dt * rate));
}

/* ---------------- draw ---------------- */
function drawBubble(x, y, ch, col, t) {

    const y = w === victim ? (w.sit ? FY - 262 : FY - 285) : top;
    if (w.state === 'warn') drawBubble(w.x, y, '?', '#e0a200', T);
    else if (w.state === 'look') drawBubble(w.x, y, '!', '#d62828', T);

}

function drawHUD() {

  if (mode !== 'play' && mode !== 'stealing') return;
  const x0 = 300, y0 = 506, w = 360, h = 20;

  rrect(x0, y0, w, h, 8, '#2a2230', 2.5);
  const target = victim.x - REACH, tol = L.tol;
  const zp = v => x0 + clamp(v / MAXL / MAXP, 0, 1) * w;
  if (L.hint >= 3) { ctx.fillStyle = 'rgba(76,217,100,.85)'; ctx.fillRect(zp(target - tol - ax), y0 + 2, Math.max(3, zp(target + tol - ax) - zp(target - tol - ax)), h - 4); }
  else if (L.hint === 2) { ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(zp(target - ax) - 1.5, y0 + 2, 3, h - 4); }
  const f = clamp(power / MAXP, 0, 1);
  if (f > 0) {
    ctx.save(); ctx.beginPath(); ctx.roundRect(x0, y0, w, h, 8); ctx.clip();
    const g = ctx.createLinearGradient(x0, 0, x0 + w, 0); g.addColorStop(0, '#ffe066'); g.addColorStop(.75, '#ff922b'); g.addColorStop(1, '#e03131');
    ctx.fillStyle = g; ctx.globalAlpha = L.hint >= 3 ? .8 : 1; ctx.fillRect(x0, y0 + 3, w * f, h - 6); ctx.restore();
    ctx.fillStyle = '#fff'; ctx.fillRect(x0 + w * f - 2, y0 - 3, 4, h + 6);
  } else text(TX('hold'), W / 2, y0 + h / 2 + 1, 15, 'rgba(255,255,255,.6)');
  if (lvIdx === 0 && !everCharged && mode === 'play') {
    ctx.fillStyle = 'rgba(15,10,20,.72)'; ctx.beginPath(); ctx.roundRect(W / 2 - 400, 52, 800, 44, 14); ctx.fill();
    text(TX('hint'), W / 2, 75, 20, '#fff');
  }
}
function drawStars(cx, cy, n, size) {
  for (let i = 0; i < 3; i++) text('★', cx + (i - 1) * size * 1.3, cy, size, i < n ? '#ffd23f' : '#4a4352', { stroke: INK });
}
function panel(title, sub, col) {
  ctx.fillStyle = 'rgba(10,6,16,.62)'; ctx.fillRect(0, 0, W, H);
  const k = easeOut(clamp(modeT * 3, 0, 1));
  ctx.save(); ctx.translate(W / 2, H / 2 - 30); ctx.scale(.6 + .4 * k, .6 + .4 * k);
  text(title, 0, -50, 84, col, { stroke: INK, shadow: 'rgba(0,0,0,.5)' });
  if (sub) text(sub, 0, 10, 26, '#fff', { stroke: INK });
  ctx.restore();
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-shake, shake) * .5, rnd(-shake, shake) * .5);
  SCENES[L.scene](T);
  guards.slice().sort((a, b) => a.x - b.x).forEach(g => g.kind === 'parrot' ? drawParrot(g, T) : drawGuard(g, T));
  drawVictim(victim, T);
  drawMarker();
  // assassin (+ speed trail)
  const mood = aState === 'caught' ? 'caught' : aState === 'charge' ? 'charge' : (aState === 'grab' || aState === 'cheer') ? 'win' : 'idle';
  trail.forEach((tx, i) => { ctx.globalAlpha = (i + 1) / trail.length * .22; drawAssassin(tx, POSE.lunge, 'idle', T); });
  ctx.globalAlpha = 1;
  drawAssassin(ax, AP, mood, T);
  if (aState === 'lunge') { ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3; for (let i = 0; i < 5; i++) { const y = FY - 40 - i * 34; ctx.beginPath(); ctx.moveTo(ax - 40 - i * 14, y); ctx.lineTo(ax - 120 - i * 20, y); ctx.stroke(); } }
  if (loot) {
    const k = Math.min(1, loot.t / .5), e = easeOut(k);
    const lx = lerp(loot.x0, ax + 6, e), ly = lerp(loot.y0, FY - 270, e) - Math.sin(k * Math.PI) * 60 + (k >= 1 ? Math.sin(T * 5) * 4 : 0);
    if (k >= 1) { ctx.fillStyle = 'rgba(255,230,120,.25)'; ctx.beginPath(); ctx.arc(lx, ly + 6, 34 + Math.sin(T * 6) * 3, 0, 7); ctx.fill(); }
    drawLootItem(loot.kind, lx, ly, T, 1 + e * .6);
  }
  parts.forEach(p => { ell(p.x, p.y, p.r, Math.max(1, p.r * Math.abs(Math.cos(T * 12 + p.r))), '#ffd23f', 1.5); });
  if (mode === 'play' || mode === 'caught' || mode === 'stealing') drawIndicators();
  pops.forEach(p => { ctx.globalAlpha = clamp(p.t * 2, 0, 1); text(p.s, p.x, p.y, p.size, p.col, { stroke: INK }); ctx.globalAlpha = 1; });
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = `rgba(${flashCol},${flash * .45})`; ctx.fillRect(0, 0, W, H); }

  if (mode === 'menu') drawMenu();
  else {
    drawHUD();
    if (mode === 'intro') {
      const f = modeT < .3 ? modeT / .3 : modeT > 1.3 ? clamp((1.6 - modeT) / .3, 0, 1) : 1;
      ctx.fillStyle = `rgba(10,6,16,${.62 * f})`; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = f;
      text(`${TX('lvl')} ${lvIdx + 1}`, W / 2, 190, 34, '#ffd23f', { stroke: INK });
      text(lvName(L).toUpperCase(), W / 2, 260, 78, '#fff', { stroke: INK, shadow: 'rgba(0,0,0,.5)' });
      text(TX('target', lootName(L.kind)), W / 2, 330, 22, '#d9cfe6');
      ctx.globalAlpha = 1;
    }
    if (mode === 'caught' && modeT > .45) { panel(TX('busted'), caughtMsg, '#ff5252'); if (modeT > .7) text(TX('retry'), W / 2, H / 2 + 80, 28, '#ffd23f', { stroke: INK }); }
    if (mode === 'clear') {
      panel(TX('stolen'), TX('swiped', lootName(L.kind)), '#ffd23f');
      drawStars(W / 2, H / 2 + 70, stars[lvIdx], 52);
      if (modeT > .6 && Math.floor(T * 2) % 2 === 0) text(lvIdx + 1 < LEVELS.length ? TX('next') : TX('again'), W / 2, H / 2 + 140, 26, '#fff', { stroke: INK });
    }
    if (mode === 'end') {
      ctx.fillStyle = 'rgba(10,6,16,.78)'; ctx.fillRect(0, 0, W, H);
      const tot = stars.reduce((a, b) => a + (b || 0), 0);
      text(TX('theEnd'), W / 2, 130, 96, '#ffd23f', { stroke: INK, shadow: 'rgba(0,0,0,.5)' });
      text(TX('sack'), W / 2, 205, 26, '#fff');
      text(`${tot} / ${LEVELS.length * 3} ★`, W / 2, 275, 60, '#ffd23f', { stroke: INK });
      stars.forEach((s, i) => text(`${lvName(LEVELS[i])}  ${'★'.repeat(s || 0)}${'☆'.repeat(3 - (s || 0))}`, W / 2, 340 + i * 26, 20, '#d9cfe6'));
      if (modeT > 1 && Math.floor(T * 2) % 2 === 0) text(TX('again'), W / 2, 515, 26, '#fff', { stroke: INK });
    }
  }
  if (muted) text(TX('muted'), W - 20, H - 16, 16, '#aaa', { align: 'right' });
}
function drawMenu() {
  ctx.fillStyle = 'rgba(15,8,25,.28)'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 60, 0, 150); g.addColorStop(0, '#ffe45e'); g.addColorStop(1, '#f0a800');
  ctx.save(); ctx.translate(W / 2, 100);
  ctx.shadowColor = 'rgba(255,200,0,.55)'; ctx.shadowBlur = 28;
  text('>THIEF<', 0, 0, 118, g, { stroke: '#2a1a00', sw: 12, shadow: '#2a1a00', sdx: 6, sdy: 7, font: TITLE_FONT });
  ctx.restore(); ctx.shadowBlur = 0;
  text('V. 1.0', W / 2, 172, 28, '#caa84a', { stroke: INK });
  const segs = [[TX('m1'), 40, '#ffd23f'], [TX('m2'), 58, '#ffc400'], [TX('m3'), 40, '#ffd23f']];
  const gap = 16; let tw = 0;
  segs.forEach(s => { ctx.font = `${s[1]}px ${FONT}`; s.push(ctx.measureText(s[0]).width); tw += s[3]; });
  tw += gap * (segs.length - 1);
  let cx = W / 2 - tw / 2;
  segs.forEach(s => { text(s[0], cx, 224, s[1], s[2], { align: 'left', stroke: INK, sw: s[1] * .17 }); cx += s[3] + gap; });
  text(TX('tagline'), W / 2, 272, 40, '#ffd23f', { stroke: INK, sw: 7 });
  if (Math.floor(T * 1.6) % 2 === 0) text(TX('start'), W / 2, 510, 26, '#fff', { stroke: INK });
  text(TX('keys'), 16, H - 14, 15, 'rgba(255,255,255,.6)', { align: 'left' });
}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
/* ---------------- fit to any screen: safe areas, phones held upright get the whole game turned 90 degrees ---------------- */
const wrap = document.getElementById('wrap');
const probe = document.createElement('div'); probe.id = 'fsProbe'; document.body.appendChild(probe);
function fit() {
  const vv = window.visualViewport;
  const vw = Math.round((vv && vv.width) || innerWidth), vh = Math.round((vv && vv.height) || innerHeight);
  document.documentElement.style.height = document.body.style.height = vh + 'px';
  document.documentElement.style.width = document.body.style.width = vw + 'px';
  const cs = getComputedStyle(probe);
  const it = parseFloat(cs.paddingTop) || 0, ir = parseFloat(cs.paddingRight) || 0, ib = parseFloat(cs.paddingBottom) || 0, il = parseFloat(cs.paddingLeft) || 0;
  const aw = Math.max(50, vw - il - ir), ah = Math.max(50, vh - it - ib);
  const rotated = IS_TOUCH && ah > aw * 1.1;
  const sc = rotated ? Math.min(ah / W, aw / H) : Math.min(aw / W, ah / H);
  wrap.style.transform = 'translate(' + (il + aw / 2 - W / 2) + 'px,' + (it + ah / 2 - H / 2) + 'px) ' + (rotated ? 'rotate(90deg) ' : '') + 'scale(' + sc + ')';
  const nd = Math.min(3, Math.max(1, sc * (window.devicePixelRatio || 1)));
  if (Math.abs(nd - DPR) > .05) { DPR = nd; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => { fit(); setTimeout(fit, 120); setTimeout(fit, 450); });
addEventListener('pageshow', fit);
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { fit(); setTimeout(fit, 200); }));

function applyLang() {
  document.documentElement.lang = LANG;
  FONT = LANG === 'vi' ? FONT_VI : FONT_EN;
  document.getElementById('bLang').textContent = TX('langBtn');
  document.getElementById('bHome').title = TX('home'); document.getElementById('bLang').title = TX('lang'); document.getElementById('bFull').title = TX('full');
}
function setLang(l) { LANG = l; try { localStorage.setItem('ag-lang', l); } catch (e) { /* ignore */ } applyLang(); }
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    const lock = () => { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) { /* ignore */ } };
    if (p && p.then) p.then(lock, () => {}); else lock();
  } catch (e) { /* ignore */ }
}
document.getElementById('bLang').addEventListener('click', e => { setLang(LANG === 'vi' ? 'en' : 'vi'); e.currentTarget.blur(); });
document.getElementById('bHome').addEventListener('click', e => { e.currentTarget.blur(); location.href = '/'; });
document.getElementById('bFull').addEventListener('click', e => { toggleFullscreen(); e.currentTarget.blur(); });
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) document.getElementById('bFull').style.display = 'none';
if (location.protocol === 'file:') document.getElementById('bHome').style.display = 'none';
document.getElementById('nav').addEventListener('pointerdown', e => e.stopPropagation());
fit(); applyLang();
setup(0); mode = 'menu';
if (document.fonts && document.fonts.load) { document.fonts.load(`40px 'Uncial Antiqua'`).catch(() => {}); document.fonts.load(`40px 'Alfa Slab One'`, 'ABCabc').catch(() => {}); document.fonts.load(`40px 'Alfa Slab One'`, 'ẤẾỀ').catch(() => {}); }
requestAnimationFrame(frame);

// debug hook for automated testing
window.__thief = { get state() { return { mode, aState, power, ax, slips, lvIdx, vstate: victim && victim.state }; }, press, release, startLevel };
})();
</script>
