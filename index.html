<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tic Tac Toe Ultimate</title>
<style>
:root{
  --bg1:#0a0320;--bg2:#2b0b4e;--glow1:rgba(244,63,224,.28);--glow2:rgba(34,140,255,.25);
  --panel:rgba(16,7,38,.82);--panel-b:rgba(255,255,255,.12);
  --line:#8b5cf6;--x:#ff3dcb;--o:#22e5ff;--accent:#f43fe0;--accent2:#a23cff;
  --text:#fff;--muted:#b9a9ea;
}

:root[data-theme="tet"]{--bg1:#ffd84a;--bg2:#f6a623;--glow1:rgba(255,255,255,.3);--glow2:rgba(255,160,40,.3);--panel:rgba(88,10,18,.9);--panel-b:rgba(255,215,120,.32);--line:#ffcf5a;--x:#ffd24a;--o:#ff9db0;--accent:#ff4a3d;--accent2:#c9182a;--muted:#ffdcb3}
:root[data-theme="noel"]{--bg1:#0a1a12;--bg2:#4a0f16;--glow1:rgba(255,70,80,.28);--glow2:rgba(60,210,130,.22);--line:#f0c05a;--x:#ff5560;--o:#6df0a0;--accent:#e8383f;--accent2:#1f9d5a;--muted:#ffd9cf}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--text);
  background:
    radial-gradient(900px 600px at 8% 0%,var(--glow1),transparent 60%),
    radial-gradient(900px 700px at 100% 100%,var(--glow2),transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;overflow:hidden;
}
body::after{ /* retro floor grid */
  content:"";position:fixed;left:-20%;right:-20%;bottom:-30%;height:60%;pointer-events:none;opacity:.18;
  background:
    repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 70px),
    repeating-linear-gradient(0deg,var(--line) 0 2px,transparent 2px 50px);
  transform:perspective(500px) rotateX(62deg);transform-origin:top;
  mask-image:linear-gradient(to bottom,#000,transparent);-webkit-mask-image:linear-gradient(to bottom,#000,transparent);
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

.app{position:relative;z-index:1;display:grid;grid-template-columns:clamp(205px,23vw,320px) minmax(0,1fr) clamp(190px,21vw,300px);gap:clamp(12px,2vw,26px);height:100vh;padding:18px clamp(12px,2vw,24px);align-items:center}
.left,.right{display:flex;flex-direction:column;gap:14px;min-width:0}
.center{display:flex;align-items:center;justify-content:center;height:100%;min-height:0}

/* ---------- Left ---------- */
.logo{text-align:center}
.logo h1{font-size:30px;font-weight:900;letter-spacing:.04em;line-height:1;text-shadow:0 0 14px var(--accent),0 0 32px var(--accent);font-family:"Trebuchet MS","Segoe UI",sans-serif}
.logo .badge{display:inline-block;margin-top:8px;padding:2px 18px;border-radius:999px;border:2px solid var(--o);color:var(--o);font-size:12px;font-weight:800;letter-spacing:.35em;text-shadow:0 0 8px var(--o);box-shadow:0 0 12px -2px var(--o),inset 0 0 10px -4px var(--o)}
.toolbar{display:flex;gap:8px;justify-content:space-between}
.ibtn{flex:1;height:44px;max-width:56px;border-radius:12px;background:var(--panel);border:1.5px solid var(--panel-b);display:grid;place-items:center;transition:.15s;position:relative}
.ibtn:hover{transform:translateY(-2px);border-color:var(--accent)}
.ibtn svg{width:22px;height:22px}
.ibtn.dice{color:#7dffd0}
.ibtn.flag svg{width:26px;height:18px;border-radius:2px}
.ibtn.off{opacity:.55}
.stylebox{position:relative}
.stylebtn{width:100%;height:48px;border-radius:14px;background:var(--panel);border:2px solid #f2c038;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 0 14px -4px #f2c038}
.stylebtn svg{width:20px;height:20px}
.pop{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:20;background:rgba(18,8,42,.97);border:1.5px solid var(--panel-b);border-radius:14px;padding:8px;display:none;flex-direction:column;gap:4px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.pop.open{display:flex}
.swatch{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-weight:700;text-align:left}
.swatch:hover,.swatch.on{background:rgba(255,255,255,.1)}
.swatch i{width:30px;height:20px;border-radius:6px;display:block;border:1px solid rgba(255,255,255,.3)}

.scores{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.score{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;background:var(--panel);border:2px solid var(--panel-b);transition:.2s}
.score .mark{width:30px;height:30px;flex:none}
.score .name{font-weight:800;font-size:18px;display:flex;align-items:center;gap:6px}
.score .swap{font-size:16px;opacity:.7;padding:2px 6px;border-radius:6px}
.score .swap:hover{opacity:1;background:rgba(255,255,255,.12)}
.score b{margin-left:auto;font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}
.score.active.m1{border-color:var(--x);box-shadow:0 0 18px -3px var(--x)}
.score.active.m2{border-color:var(--o);box-shadow:0 0 18px -3px var(--o)}
.draws{text-align:center;font-weight:800;color:var(--muted);font-size:14px}
.draws b{color:#fff}
.status{text-align:center;font-size:23px;font-weight:900;min-height:34px;text-shadow:0 0 14px rgba(255,255,255,.35);margin-top:4px}
.status.win{color:#ffe66b;text-shadow:0 0 16px #ffb300}
.status.lose{color:#ff8fa6}
.actions{display:flex;gap:12px}
.act{flex:1;height:48px;border-radius:12px;font-weight:800;color:#2a1a00;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(#ffe685,#f5c43a);box-shadow:0 4px 0 #b78512,0 6px 14px rgba(0,0,0,.35);transition:.1s}
.act:hover{filter:brightness(1.08)}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 #b78512}
.act.undo{background:linear-gradient(#c9b27a,#a38a4f);box-shadow:0 4px 0 #6d5a2c,0 6px 14px rgba(0,0,0,.35)}
.act svg{width:18px;height:18px}
.act:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.rule{text-align:center;color:var(--muted);font-size:13px;line-height:1.35;min-height:36px}

/* ---------- Board ---------- */
.boardwrap{position:relative;width:min(100%,calc(100vh - 36px));aspect-ratio:1}
.board{
  --pad:clamp(16px,3.4vmin,34px);
  position:absolute;inset:0;padding:var(--pad);border-radius:34px;
  background:linear-gradient(160deg,rgba(32,12,70,.85),rgba(14,6,34,.9));
  border:2px solid rgba(139,92,246,.5);box-shadow:0 0 40px -6px rgba(139,92,246,.55),inset 0 0 60px rgba(60,20,120,.35);
}
.grid{display:grid;width:100%;height:100%}
.cell{position:relative;display:grid;place-items:center;padding:0;outline:none;min-width:0;min-height:0;transition:background .2s}
.cell.br::after{content:"";position:absolute;top:0;bottom:0;right:-1.5px;width:3px;border-radius:3px;background:var(--line);box-shadow:0 0 10px var(--line),0 0 3px #fff8;z-index:1;pointer-events:none}
.cell.bb::before{content:"";position:absolute;left:0;right:0;bottom:-1.5px;height:3px;border-radius:3px;background:var(--line);box-shadow:0 0 10px var(--line),0 0 3px #fff8;z-index:1;pointer-events:none}
.cell.br.t::after{top:calc(var(--pad)*-.85)}
.cell.br.bt::after{bottom:calc(var(--pad)*-.85)}
.cell.bb.l::before{left:calc(var(--pad)*-.85)}
.cell.bb.rt::before{right:calc(var(--pad)*-.85)}
.cell:not(.locked):hover{background:radial-gradient(circle,rgba(255,255,255,.09),transparent 70%)}
.cell.locked{cursor:default}
.mk{width:62%;height:62%;overflow:visible;pointer-events:none}
.mk path,.mk circle{fill:none;stroke-width:11;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0;animation:draw .3s ease-out both;animation-delay:var(--d,0s)}
.mk.x{color:var(--x)}.mk.o{color:var(--o)}
.mk.x path{stroke:var(--x)}.mk.o circle{stroke:var(--o)}
.mk.big{filter:drop-shadow(0 0 7px currentColor)}
.mk.static path,.mk.static circle{animation:none}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.ghost{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.ghost .mk{filter:none}
.cell:not(.locked):hover .ghost{opacity:.28}
.cell.hint .ghost{opacity:.7;animation:blink .6s infinite alternate}
@keyframes blink{from{opacity:.25}to{opacity:.85}}
.cell.last .mk{filter:drop-shadow(0 0 12px currentColor)}
.cell.fading .mk{animation:fadeout 1s infinite alternate}
.cell.fading .mk path,.cell.fading .mk circle{animation:none}
@keyframes fadeout{from{opacity:.9}to{opacity:.3}}
.cell.win{background:radial-gradient(circle,rgba(255,255,255,.2),transparent 72%)}
.cell.win .mk{animation:pulse .6s ease-in-out infinite alternate;filter:drop-shadow(0 0 14px currentColor)}
.cell.win.bad{background:radial-gradient(circle,rgba(255,60,60,.28),transparent 72%)}
@keyframes pulse{from{transform:scale(.95)}to{transform:scale(1.14)}}

.overlay{position:absolute;inset:0;border-radius:34px;display:none;place-items:center;background:rgba(6,2,18,.5);backdrop-filter:blur(2px);z-index:5;cursor:pointer;animation:fadein .35s}
.overlay.show{display:grid}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.result{text-align:center;padding:22px 34px;border-radius:22px;background:rgba(18,8,42,.95);border:2px solid var(--accent);box-shadow:0 0 36px -4px var(--accent);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.result h2{font-size:clamp(22px,5vmin,36px);font-weight:900;margin-bottom:14px;text-shadow:0 0 16px var(--accent)}
.again{padding:12px 28px;border-radius:14px;font-weight:900;font-size:17px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 18px -2px var(--accent)}
.again:hover{filter:brightness(1.12)}

/* ---------- Right ---------- */
.sec{font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--muted);margin:6px 4px -6px}
.opt{width:100%;height:clamp(44px,7.2vh,58px);border-radius:16px;font-size:clamp(16px,1.9vw,20px);font-weight:800;background:var(--panel);border:2px solid var(--panel-b);transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.opt:hover{border-color:var(--accent);transform:translateY(-1px)}
.opt.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:rgba(255,255,255,.55);box-shadow:0 0 22px -2px var(--accent)}
.opt svg{width:14px;height:14px;transition:.2s}
.opt.open svg{transform:rotate(180deg)}
.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modegrid .opt{height:clamp(38px,5.6vh,46px);font-size:clamp(14px,1.5vw,17px);border-radius:14px;padding:0 4px}
.modegrid .opt.wide{grid-column:1/-1}
.seg{display:flex;padding:5px;border-radius:16px;background:var(--panel);border:2px solid var(--panel-b);gap:4px}
.seg button{flex:1;height:46px;border-radius:12px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.seg button:hover{background:rgba(255,255,255,.08)}
.seg.opp button.on{background:linear-gradient(#35e1ff,#13a9e6);color:#032a3a;box-shadow:0 0 16px -2px #35e1ff}
.seg.lvl button.on{background:linear-gradient(#ffc04d,#ff8a1f);color:#3a1d00;box-shadow:0 0 16px -2px #ff9a2e}
.seg svg{width:16px;height:16px}
.dim{opacity:.4;pointer-events:none}

.board.dense .cell.br::after{width:2px;right:-1px;box-shadow:0 0 6px var(--line)}
.board.dense .cell.bb::before{height:2px;bottom:-1px;box-shadow:0 0 6px var(--line)}
.board.dense .mk{width:66%;height:66%}

/* ---------- Capybara mascot ---------- */
.capy{position:fixed;left:0;top:0;z-index:40;pointer-events:none;transform-origin:0 0;will-change:transform;display:none}
.capy.on{display:block}
.capy svg{width:100%;height:100%;overflow:visible;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.capy .ks,.capy .kd,.capy .kt,.capy .kq,.capy .ko,.capy .kr{display:none}
.capy.c-santa .ks,.capy.c-deer .kd,.capy.c-tree .kt,.capy.c-quan .kq,.capy.c-quyt .ko,.capy.c-rong .kr{display:inline}
.capy .cb{fill:var(--cb,#d9a45f)}
body.tet .capy{--cb:#c79b68}
.capy .spark{transform-box:fill-box;transform-origin:center;animation:sparkle .32s ease-in-out infinite alternate}
@keyframes sparkle{from{transform:scale(.8) rotate(-8deg);opacity:.75}to{transform:scale(1.15) rotate(10deg);opacity:1}}
.capy .waddle{transform-origin:60px 130px;animation:waddle .5s ease-in-out infinite}
.capy .foot{animation:footup .5s ease-in-out infinite}
.capy .foot.r{animation-delay:-.25s}
.capy .sway{transform-origin:92px 98px;animation:sway .5s ease-in-out infinite alternate}
.capy.idle .waddle{animation:capybreathe 1.8s ease-in-out infinite}
.capy.idle .foot,.capy.idle .sway{animation:none}
.capy.hop svg{animation:capyhop .6s ease-out 3}
@keyframes waddle{0%,100%{transform:rotate(-5deg) translateY(0)}25%,75%{transform:rotate(0) translateY(-6px)}50%{transform:rotate(5deg) translateY(0)}}
@keyframes footup{0%,50%,100%{transform:translateY(0)}25%{transform:translateY(-6px)}}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes capybreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,1.04)}}
@keyframes capyhop{0%,100%{transform:translateY(0)}45%{transform:translateY(-22px)}}
.swatch .tog{width:30px;height:18px;border-radius:999px;background:rgba(255,255,255,.2);position:relative;flex:none;transition:.2s}
.swatch .tog::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.swatch .tog.on{background:#25e08a}.swatch .tog.on::after{left:14px}
.petrow{border-top:1px solid var(--panel-b);margin-top:2px;border-radius:0 0 10px 10px}

/* ---------- Christmas decorations ---------- */
#snow{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#xmas{position:fixed;inset:0;pointer-events:none;z-index:2}
#xmas[hidden],#snow[hidden]{display:none}
#xLights{position:fixed;top:0;left:0;width:100%;height:40px;z-index:32;overflow:visible}
.bulb ellipse{animation:twinkle 1.8s ease-in-out infinite;filter:drop-shadow(0 0 5px var(--c))}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.3}}
.xground{position:fixed;left:0;right:0;bottom:0;height:clamp(34px,6vh,60px);z-index:0;filter:drop-shadow(0 -2px 10px rgba(180,210,255,.35))}
.xdeco{position:fixed;bottom:clamp(14px,3.2vh,32px);display:flex;align-items:flex-end;gap:4px;z-index:2}
.xdeco.xl{left:clamp(6px,1.4vw,26px);flex-direction:row}.xdeco.xr{right:clamp(6px,1.4vw,26px);flex-direction:row}
.xdeco svg{display:block;overflow:visible;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.xtree{height:clamp(86px,15vh,150px);width:auto;aspect-ratio:100/140}
.xtree.sm{height:clamp(66px,11vh,110px)}
.xgift{height:clamp(24px,4.4vh,44px);width:auto;aspect-ratio:1}
.xgift.lg{height:clamp(32px,5.8vh,56px)}
.twinkle-star{animation:twinkle 1.4s ease-in-out infinite}
.ttl{position:relative;display:inline-block}
.hat{display:none;position:absolute;right:-14px;top:-18px;width:34px;height:auto;transform:rotate(16deg);filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
body.xmas.noel .hat-noel,body.xmas.tet .hat-tet{display:block}
.hat-tet{right:-12px;top:-17px;width:32px}
body.tet .noelonly,body:not(.tet) .tetonly{display:none!important}
body.tet .xground path{fill:url(#goldg)}
.xenv{height:clamp(30px,5.6vh,54px);width:auto;aspect-ratio:50/66}
.xchung{height:clamp(26px,4.8vh,46px);width:auto;aspect-ratio:1}
.lantern .swing{transform-box:fill-box;transform-origin:50% 0;animation:lanternswing 3.2s ease-in-out infinite alternate}
.lantern:nth-child(even) .swing{animation-delay:-1.6s}
@keyframes lanternswing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.seasonrow{display:flex;gap:6px;padding:4px 4px 6px}
.sbtn{flex:1;height:32px;border-radius:9px;background:rgba(255,255,255,.08);font-weight:800;font-size:13px;transition:.15s}
.sbtn:hover{background:rgba(255,255,255,.16)}
.sbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 12px -3px var(--accent)}
.merry{display:none;margin-top:6px;font-weight:900;font-size:12px;letter-spacing:.06em;background:linear-gradient(90deg,#ff7a7a,#ffd166,#7dffb0);-webkit-background-clip:text;background-clip:text;color:transparent}
body.xmas .merry{display:block}
@media (max-height:620px),(max-width:900px){.xdeco,#xLights,.xground{display:none}}

/* ---------- Tet theme: bright golden background, readable text, red panels ---------- */
:root[data-theme="tet"] body{
  background:linear-gradient(to top,#ffd84a 0%,#f6a623 12%,#d2601f 27%,#7c1521 46%,#3b0a19 68%,#17040e 100%);
  background-attachment:fixed;
}
:root[data-theme="tet"] body::before{      /* sunrise rays fanning up from the horizon, fading into the night sky */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-conic-gradient(from -90deg at 50% 108%,rgba(255,236,160,.38) 0 4deg,rgba(255,236,160,0) 4deg 8deg);
  -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 58%);mask-image:linear-gradient(to top,#000 0%,transparent 58%);
}
:root[data-theme="tet"] body::after{display:none}
:root[data-theme="tet"] .logo .badge{border-color:#ffd24a;color:#ffd24a;text-shadow:0 0 8px #ffb02e;box-shadow:0 0 12px -2px #ffb02e,inset 0 0 10px -4px #ffb02e}
:root[data-theme="tet"] .merry{background:linear-gradient(90deg,#ffd24a,#fff4c2,#ffd24a);-webkit-background-clip:text;background-clip:text}
:root[data-theme="tet"] .score .swap{color:#fff}
:root[data-theme="tet"] .board{background:linear-gradient(160deg,rgba(118,14,26,.97),rgba(64,6,14,.98));border-color:rgba(255,207,90,.7);box-shadow:0 0 40px -6px rgba(255,170,40,.75),0 12px 30px rgba(120,20,10,.35),inset 0 0 60px rgba(170,34,22,.35)}
:root[data-theme="tet"] .overlay{background:rgba(60,6,12,.55)}
:root[data-theme="tet"] .result,:root[data-theme="tet"] .card,:root[data-theme="tet"] .pop{background:rgba(76,9,18,.98)}
:root[data-theme="tet"] .seg.opp button.on{background:linear-gradient(#ffe066,#f2a81a);color:#4a1004;box-shadow:0 0 16px -2px #ffd24a}
:root[data-theme="tet"] .seg.lvl button.on{background:linear-gradient(#ff7a4a,#d92b1f);color:#fff;box-shadow:0 0 16px -2px #ff5a3a}
:root[data-theme="tet"] .act{background:linear-gradient(#ff7a4a,#d8322f);color:#fff;box-shadow:0 4px 0 #8c1a16,0 6px 14px rgba(120,20,10,.4)}
:root[data-theme="tet"] .act svg{filter:brightness(0) invert(1)}
:root[data-theme="tet"] .act.undo{background:linear-gradient(#c8793e,#8a4620);box-shadow:0 4px 0 #5a2a10,0 6px 14px rgba(120,20,10,.4)}
:root[data-theme="tet"] .stylebtn{border-color:#ffd24a}
:root[data-theme="tet"] .xground{filter:drop-shadow(0 -2px 10px rgba(255,255,255,.5))}
#fwc{position:fixed;inset:0;width:100%;height:100%;z-index:31;pointer-events:none}
#fwc[hidden]{display:none}

/* ---------- Big board (50×50) ---------- */
.boardwrap.big{width:min(100%,calc(100vh - 24px));aspect-ratio:1}
.app:has(.boardwrap.big){grid-template-columns:clamp(222px,21vw,290px) minmax(0,1fr) clamp(214px,20vw,270px);padding:12px clamp(10px,1.4vw,20px);gap:clamp(10px,1.4vw,20px)}
.seg button{white-space:nowrap;font-size:clamp(13px,1.4vw,16px);padding:0 4px}
.seg button svg{flex:none}
.status{font-size:clamp(18px,2vw,23px)}
@media (max-width:900px){.boardwrap.big{width:min(100%,94vw)}}
.board.big{overflow:auto;padding:14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;cursor:grab;overscroll-behavior:contain}
.board.big.panning{cursor:grabbing}
.board.big{display:flex}
.board.big .grid{margin:auto}
.board.big .grid{width:calc(var(--n)*var(--cs));height:calc(var(--n)*var(--cs));flex:none;
  background-image:linear-gradient(var(--line) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--line) 1.5px,transparent 1.5px);
  background-size:var(--cs) var(--cs);box-shadow:inset -1.5px -1.5px 0 var(--line)}
.board.big .cell::before,.board.big .cell::after{display:none}
.board.big .cell{cursor:pointer}
.board.big .cell.locked{cursor:inherit}
.board.big .mk{width:74%;height:74%}
.board.big .mk.big{filter:none}
.board.big .cell.last .mk,.board.big .cell.win .mk{filter:drop-shadow(0 0 6px currentColor)}
.board.big .cell:not(.locked):hover{background:rgba(255,255,255,.16)}
.zoombox{position:absolute;right:16px;bottom:16px;z-index:6;display:flex;flex-direction:column;gap:6px}
.zoombox[hidden]{display:none}
.zoombox button{width:38px;height:38px;border-radius:10px;font-size:20px;font-weight:900;background:rgba(18,8,42,.92);border:1.5px solid var(--panel-b);display:grid;place-items:center;transition:.12s}
.zoombox button:hover{border-color:var(--accent);transform:scale(1.07)}
.zoombox svg{width:18px;height:18px}

/* ---------- Online ---------- */
.onlinebtn{height:clamp(42px,6.4vh,52px);font-size:clamp(15px,1.7vw,18px)}
.onlinebtn svg{width:20px!important;height:20px!important}
.onlinebtn.on{background:linear-gradient(135deg,#25e08a,#0aa6c9);border-color:rgba(255,255,255,.55);box-shadow:0 0 22px -2px #25e08a;color:#02291f}
.onpanel{display:none;flex-direction:column;gap:9px;padding:12px;border-radius:16px;background:var(--panel);border:2px solid rgba(37,224,138,.45)}
.onpanel.show{display:flex}
.oncount{font-size:12px;font-weight:800;letter-spacing:.06em;color:#7dffc0;display:flex;align-items:center;gap:6px}
.oncount i{width:8px;height:8px;border-radius:50%;background:#25e08a;box-shadow:0 0 8px #25e08a;display:block}
.oncount.off i{background:#ff5d6c;box-shadow:0 0 8px #ff5d6c}
.onbody{display:flex;flex-direction:column;gap:8px}
.onbody .sub{font-size:14px;font-weight:700;text-align:center;line-height:1.35}
.onbody .err{color:#ff8fa6;font-size:13px;text-align:center;font-weight:700}
.obtn{height:42px;border-radius:12px;font-weight:800;font-size:15px;background:rgba(255,255,255,.1);border:1.5px solid var(--panel-b);transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.obtn:hover{border-color:#25e08a;transform:translateY(-1px)}
.obtn.pri{background:linear-gradient(135deg,#25e08a,#0aa6c9);color:#02291f;border-color:transparent}
.obtn.danger{background:rgba(255,93,108,.18);border-color:rgba(255,93,108,.5)}
.joinrow{display:flex;gap:8px}
.joinrow input{flex:1;min-width:0;height:42px;border-radius:12px;border:1.5px solid var(--panel-b);background:rgba(0,0,0,.3);color:#fff;font:800 17px "Segoe UI",sans-serif;text-align:center;letter-spacing:.3em;text-transform:uppercase;outline:none}
.joinrow input:focus{border-color:#25e08a}
.joinrow .obtn{padding:0 14px}
.code{font-size:34px;font-weight:900;letter-spacing:.3em;text-align:center;color:#7dffc0;text-shadow:0 0 14px #25e08a;padding-left:.3em}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#25e08a;animation:spin .9s linear infinite;margin:2px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.emotes{display:flex;gap:6px;justify-content:center}
.emotes button{font-size:22px;width:42px;height:38px;border-radius:10px;background:rgba(255,255,255,.08);transition:.1s}
.emotes button:hover{background:rgba(255,255,255,.18);transform:scale(1.12)}
.emote{position:absolute;z-index:8;font-size:clamp(36px,8vmin,64px);pointer-events:none;animation:rise 1.8s ease-out forwards;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.emote.mine{left:8%;bottom:6%}.emote.theirs{right:8%;top:6%}
@keyframes rise{0%{opacity:0;transform:translateY(20px) scale(.5)}15%{opacity:1;transform:scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1)}}
.resbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.again.ghostbtn{background:rgba(255,255,255,.12);box-shadow:none}
.again:disabled{opacity:.55;cursor:default;filter:none}
.ressub{min-height:20px;margin:-6px 0 12px;font-size:14px;font-weight:700;color:var(--muted)}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(4,1,14,.7);backdrop-filter:blur(4px);padding:16px}
.modal.show{display:grid}
.card{width:min(460px,100%);max-height:90vh;overflow:auto;background:rgba(20,9,46,.98);border:2px solid var(--accent);border-radius:20px;padding:22px;box-shadow:0 0 40px -6px var(--accent)}
.card h3{font-size:22px;margin-bottom:14px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;text-align:center}
th{color:var(--muted);font-size:12px;letter-spacing:.08em;border-bottom:1px solid var(--panel-b)}
td:first-child,th:first-child{text-align:left;font-weight:800}
tr:nth-child(even) td{background:rgba(255,255,255,.04)}
.card .row{display:flex;gap:10px;margin-top:16px}
.card .row button{flex:1;height:42px;border-radius:12px;font-weight:800;background:rgba(255,255,255,.1)}
.card .row button.pri{background:linear-gradient(135deg,var(--accent),var(--accent2))}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  body{overflow:auto}
  .app{display:flex;flex-direction:column;height:auto;min-height:100vh;padding:14px 14px 40px;gap:14px;align-items:stretch}
  .left{display:contents}
  .logo{order:1}.toolbar{order:2}.stylebox{order:3}.scores{order:4}
  .center{order:5;height:auto}
  .status{order:6}.actions{order:7}.rule{order:8}
  .right{order:9}
  .boardwrap{width:min(100%,92vw)}
  .logo h1{font-size:26px}
  .ibtn{max-width:none}
  .score{padding:10px 14px}.score b{font-size:28px}
  .opt{height:50px;font-size:18px}
}
/* ---------- Compact menus on desktop: leave the room to the board ---------- */
@media (min-width:901px){
  .app,.app:has(.boardwrap.big){grid-template-columns:clamp(168px,16vw,225px) minmax(0,1fr) clamp(172px,17vw,225px);gap:clamp(8px,1.1vw,16px);padding:10px clamp(8px,1.1vw,16px)}
  .left,.right{gap:8px}
  .logo h1{font-size:clamp(19px,1.9vw,26px)}
  .logo .badge{font-size:10px;padding:1px 12px;margin-top:5px}
  .toolbar{gap:5px}
  .ibtn{height:36px;border-radius:10px}.ibtn svg{width:18px;height:18px}.ibtn.flag svg{width:22px;height:15px}
  .stylebtn{height:38px;font-size:14px;border-radius:12px}
  .scores{margin-top:2px;gap:4px}
  .score{padding:8px 12px;border-radius:14px;gap:8px}.score .mark{width:24px;height:24px}.score .name{font-size:15px}.score b{font-size:26px}
  .draws{font-size:12px}
  .status{font-size:clamp(15px,1.5vw,19px);min-height:24px;margin-top:0}
  .act{height:38px;font-size:14px;border-radius:10px}
  .rule{font-size:11.5px;min-height:0}
  .sec{font-size:10.5px;margin:2px 4px -4px}
  .opt{height:40px;font-size:15px;border-radius:12px}
  .modegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .modegrid .opt{height:38px;font-size:13px;padding:0;letter-spacing:-.2px}
  .seg{padding:4px;border-radius:12px}.seg button{height:34px;font-size:13px;border-radius:9px;gap:0;min-width:0}.seg button svg{display:none}
  .onlinebtn{height:40px;font-size:15px}
  .onpanel{padding:9px;gap:7px}.obtn{height:36px;font-size:13px}.code{font-size:28px}
}
@media (max-height:640px) and (min-width:901px){
  .logo h1{font-size:24px}.score{padding:9px 14px}.score b{font-size:28px}.opt{height:48px;font-size:18px}
  .app{gap:18px;padding:10px 18px}.left,.right{gap:9px}.status{font-size:19px}.rule{display:none}
}
</style>

function doMove(idx, remote) {
  const p = G.turn;
  if (online() && !remote) netSend({t:'move', i:idx});
  G.hist.push({b:G.b.slice(), q:[G.q[0].slice(), G.q[1].slice()], turn:G.turn, last:G.last, moves:G.moves});
  const r = applyMove(G, idx, p, G.cfg);
  G.b = r.b; G.q = r.q; G.last = idx; G.moves++; hintIdx = -1; clearTimeout(hintTimer);
  const line = lineAt(G.b, G.n, G.cfg.k, idx, p);
  let winner = null;
  if (line) { G.win = line; winner = G.cfg.misere ? 3-p : p; }
  else if (!G.cfg.endless && G.b.every(x => x)) winner = 0;
  else if (G.cfg.endless && G.moves >= 120) winner = 0;

}
function finish(winner) {

  const sk = S.mode + '|' + S.opp;
  const st = S.stats[sk] || (S.stats[sk] = {w:0, d:0, l:0});
  st[key === 'you' ? 'w' : key === 'draw' ? 'd' : 'l']++;

  if (G.forfeit || net.state !== 'playing') {

let ac = null;
function beep(f, d = .1, type = 'sine', v = .08, t0 = 0) {

    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), tt = ac.currentTime + t0;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, tt); g.gain.exponentialRampToValueAtTime(.0001, tt + d);
    o.connect(g); g.connect(ac.destination); o.start(tt); o.stop(tt + d);
  } catch (e) {}
}

  lose: () => [392,330,262].forEach((f, i) => beep(f, .25, 'sawtooth', .04, i*.15)),

function confetti() {
  const cv = $('#fx'), x = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const cols = [cs.getPropertyValue('--x').trim(), cs.getPropertyValue('--o').trim(), '#ffd93d', '#ffffff', '#7CFFB2'];
  const ps = Array.from({length:120}, () => ({
    x: innerWidth/2 + (Math.random()-.5)*240, y: innerHeight*.55,
    vx: (Math.random()-.5)*15, vy: -Math.random()*15 - 4, s: 5 + Math.random()*6,
    c: cols[(Math.random()*cols.length)|0], r: Math.random()*6, vr: (Math.random()-.5)*.4
  }));
  let f = 0;
  (function tick() {
    x.clearRect(0, 0, cv.width, cv.height);
    for (const p of ps) {
      p.vy += .36; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2, -p.s/2, p.s, p.s*.6); x.restore();
    }

  })();
}

/* ===================== Online (WebSocket) ===================== */
let netQueue = [];
function serverUrl() {
  const q = new URLSearchParams(location.search).get('server'); if (q) return q;
  if (location.protocol === 'http:' || location.protocol === 'https:') return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
  return 'ws://localhost:3000';
}
function netSend(o) { if (net.ws && net.ws.readyState === 1) net.ws.send(JSON.stringify(o)); }
function netConnect(cb) {
  if (net.ws && net.ws.readyState === 1) { if (cb) cb(); return; }
  if (cb) netQueue.push(cb);
  if (net.ws && net.ws.readyState === 0) return;
  net.state = 'connecting'; net.error = ''; renderOnline(); if (G) render();
  let ws;
  try { ws = new WebSocket(serverUrl()); } catch (e) { net.state = 'off'; renderOnline(); if (G) render(); return; }
  net.ws = ws;
  ws.onopen = () => { net.state = 'idle'; renderOnline(); if (G) render(); const q = netQueue; netQueue = []; q.forEach(f => f()); };
  ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } onNet(m); };
  ws.onclose = () => {
    if (net.ws !== ws) return;
    net.ws = null; netQueue = []; net.count = 0;
    const was = net.state; net.state = 'off'; net.wantRematch = false;
    if (was === 'playing' && G && !G.over) endEarly('lost');
    else if (G && G.over && online()) updateOverlay();
    renderOnline(); if (G) render();
  };
}
function netLeave(silent) {
  netSend({t:'leave'});
  net.state = !net.ws ? 'off' : net.ws.readyState === 1 ? 'idle' : 'connecting';
  net.mark = 0; net.code = ''; net.inMatch = false; net.wantRematch = net.rematchReq = false; net.error = '';
  if (!silent) { newRound(); renderOnline(); }
}
function endEarly(kind) {
  if (!G || G.over) return;
  clearTimeout(aiTimer);
  G.over = true; G.forfeit = kind; G.result = kind === 'oppLeft' ? 'you' : 'none';
  if (kind === 'oppLeft') {
    scores.you++;
    const sk = S.mode + '|online', st = S.stats[sk] || (S.stats[sk] = {w:0, d:0, l:0});
    st.w++; save(); sfx.win(); setTimeout(confetti, 250);
  }
  net.inMatch = false; render();
  overTimer = setTimeout(showOverlay, 700);
}
function onNet(m) {
  switch (m.t) {
    case 'hello': case 'online': net.count = m.count; renderOnline(); break;
    case 'searching': net.state = 'searching'; renderOnline(); render(); break;
    case 'waiting': net.state = 'waiting'; net.code = m.code; renderOnline(); render(); break;
    case 'start':
      if (!net.inMatch) resetScores();
      net.inMatch = true; net.state = 'playing'; net.mark = m.mark; net.code = m.code; net.error = '';
      net.wantRematch = net.rematchReq = false;
      if (MODES[m.mode]) S.mode = m.mode;
      syncUI(); newRound(); sfx.win();
      break;
    case 'move':
      if (online() && G && !G.over && net.state === 'playing' && G.turn !== net.mark) doMove(m.i, true);
      break;
    case 'opp_left':
      if (G && !G.over && net.state === 'playing') { net.state = 'idle'; endEarly('oppLeft'); }
      else { net.state = 'idle'; net.inMatch = false; if (G && G.over) updateOverlay(); }
      renderOnline(); render();
      break;
    case 'rematch_req': net.rematchReq = true; updateOverlay(); break;
    case 'emote': showEmote(m.e, false); break;
    case 'error': net.error = m.msg === 'full' ? 'errFull' : 'errNotFound'; renderOnline(); break;
  }
}

const pets = [];

const SEASON_COSTUMES = {noel: ['santa', 'deer', 'tree'], tet: ['quan', 'quyt', 'rong']};
function petDressAll() {
  const list = SEASON_COSTUMES[S.season === 'tet' ? 'tet' : 'noel'], all = [...SEASON_COSTUMES.noel, ...SEASON_COSTUMES.tet];
  pets.forEach((p, i) => all.forEach(c => p.el.classList.toggle('c-' + c, c === list[i])));

function petAdd(el, costume, speed, frac, dir, yOff) {
  pets.push({el, speed, frac, dir, yOff, x: 0, started: false, idleUntil: 0, nextIdle: 0});
}
/* They run along the bottom of the screen: left corner <-> right corner (no circling). */
function petFrame(now) {

  const ch = Math.max(64, Math.min(108, Math.min(innerWidth, innerHeight) * .105)), cw = ch * .8;
  const pad = 4, minX = cw / 2 + pad, maxX = Math.max(minX + 1, innerWidth - cw / 2 - pad);

    if (!p.started) { p.x = minX + p.frac * (maxX - minX); p.started = true; p.nextIdle = now + 5000 + Math.random() * 9000; }
    let idle = now < p.idleUntil;
    if (!idle && now > p.nextIdle) { p.idleUntil = now + 1400 + Math.random() * 1200; p.nextIdle = p.idleUntil + 8000 + Math.random() * 9000; idle = true; }
    el.classList.toggle('idle', idle && !cheering);
    if (!idle || cheering) {
      p.x += p.dir * (cheering ? p.speed * 2.1 : p.speed) * dt;
      if (p.x >= maxX) { p.x = maxX; p.dir = -1; p.idleUntil = now + 600; }
      else if (p.x <= minX) { p.x = minX; p.dir = 1; p.idleUntil = now + 600; }
    }
    p.x = Math.min(maxX, Math.max(minX, p.x));
    el.style.transform = `translate(${p.x.toFixed(1)}px,${(baseY + p.yOff).toFixed(1)}px) scale(${p.dir},1) translate(${(-cw / 2).toFixed(1)}px,${(-ch).toFixed(1)}px)`;
  }
}
function petCheer() {
  if (!S.pet) return;
  petCheerUntil = performance.now() + 2200;
  if (S.season === 'tet') fwTextNow();
  pets.forEach(p => { p.el.classList.add('hop'); setTimeout(() => p.el.classList.remove('hop'), 2000); });
}
(function petBoot() {
  let hadPet = false;
  try { hadPet = /"pet"/.test(localStorage.getItem('ttt-ultimate-v1') || ''); } catch (e) {}
  if (!hadPet && window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) S.pet = false;
  const first = $('#capy');
  // three capybaras, one per costume, starting at different spots and speeds
  const cfg = [['santa', 105, 0.0, 1, 0], ['deer', 125, 0.5, -1, -3], ['tree', 90, 1.0, -1, 3]];
  cfg.forEach(([costume, speed, frac, dir, yOff], i) => {
    let el = first;
    if (i > 0) { el = first.cloneNode(true); el.removeAttribute('id'); el.className = 'capy'; document.body.appendChild(el); }
    petAdd(el, costume, speed, frac, dir, yOff);
  });
  $$('.capy').forEach(c => c.classList.toggle('on', !!S.pet));
  petDressAll();
  requestAnimationFrame(petFrame);
})();

/* ===================== Christmas decorations ===================== */
const snowCv = $('#snow'), sx = snowCv.getContext('2d');
let flakes = [], twinkles = [], snowW = 0, snowH = 0, snowLast = 0;
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const newFlake = rand => ({x: Math.random() * snowW, y: rand ? Math.random() * snowH : -8, r: 1 + Math.random() * 2.6,
  vy: 20 + Math.random() * 36, vx: (Math.random() - .5) * 14, ph: Math.random() * 6.28, sw: .5 + Math.random() * 1.2, a: .5 + Math.random() * .4});
function snowResize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  snowW = innerWidth; snowH = innerHeight;
  snowCv.width = snowW * dpr; snowCv.height = snowH * dpr; sx.setTransform(dpr, 0, 0, dpr, 0, 0);
  flakes = Array.from({length: Math.round(Math.min(130, snowW * snowH / 13000))}, () => newFlake(true));
  twinkles = Array.from({length: Math.round(snowW / 55)}, () => ({x: Math.random() * snowW, y: Math.random() * snowH * .75, r: 2 + Math.random() * 3.2, p: Math.random() * 6.28, s: .8 + Math.random() * 1.6}));
  drawLights();
}
function snowFrame(now) {
  requestAnimationFrame(snowFrame);
  if (!S.xmas) { if (snowLast) { sx.clearRect(0, 0, snowW, snowH); snowLast = 0; } return; }
  const dt = snowLast ? Math.min(.05, (now - snowLast) / 1000) : 0; snowLast = now;
  const tet = S.season === 'tet';
  sx.clearRect(0, 0, snowW, snowH);
  // twinkling 4-point stars / golden sparkles
  sx.fillStyle = tet ? '#ffffff' : '#fff6c9';
  for (const s of twinkles) {
    const a = .25 + .55 * (.5 + .5 * Math.sin(now / 1000 * s.s + s.p)), r = s.r * (.7 + .3 * a);
    sx.globalAlpha = a; sx.beginPath();
    sx.moveTo(s.x, s.y - r); sx.quadraticCurveTo(s.x, s.y, s.x + r, s.y); sx.quadraticCurveTo(s.x, s.y, s.x, s.y + r);
    sx.quadraticCurveTo(s.x, s.y, s.x - r, s.y); sx.quadraticCurveTo(s.x, s.y, s.x, s.y - r); sx.fill();
  }
  // snow (Noel) or falling plum / peach petals (Tet)
  for (const f of flakes) {
    if (!reduceMotion) { f.ph += f.sw * dt; f.y += f.vy * dt; f.x += (f.vx + Math.sin(f.ph) * 14) * dt; }
    if (f.y > snowH + 8 || f.x < -10 || f.x > snowW + 10) Object.assign(f, newFlake(false));
    sx.globalAlpha = f.a;
    if (tet) {
      sx.fillStyle = f.r < 1.9 ? '#ff6f9a' : f.r < 2.5 ? '#ffffff' : '#e53935';
      sx.save(); sx.translate(f.x, f.y); sx.rotate(f.ph * 1.6);
      sx.beginPath(); sx.ellipse(0, 0, f.r * 1.7, f.r * .95, 0, 0, 6.2832); sx.fill(); sx.restore();
    } else {
      sx.fillStyle = '#fff';
      sx.beginPath(); sx.arc(f.x, f.y, f.r, 0, 6.2832); sx.fill();
    }
  }
  sx.globalAlpha = 1;
}
function drawLights() {
  const w = innerWidth, tet = S.season === 'tet', host = $('#xLights');
  const n = Math.max(2, Math.round(w / (tet ? 200 : 170))), seg = w / n;
  host.style.height = tet ? '86px' : '40px';
  host.setAttribute('viewBox', `0 0 ${w} ${tet ? 86 : 40}`);
  if (tet) {
    const rc = $('.boardwrap').getBoundingClientRect();
    let d = 'M0 3', b = '';
    for (let i = 0; i < n; i++) {
      const x0 = i * seg, x2 = x0 + seg;
      d += ` Q${(x0 + seg / 2).toFixed(1)} 16 ${x2.toFixed(1)} 3`;
    }
    for (let i = 0; i < n; i++) {
      const x = (i + .5) * seg, y = 3 + 6.5;                     // lowest point of each sagging segment
      if (x > rc.left - 26 && x < rc.right + 26 && rc.top < 100) continue;   // never hang over the board
      b += `<g class="lantern" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><g class="swing">` +
        `<path d="M0 0V8" stroke="#e8b84a" stroke-width="2"/><rect x="-7.5" y="7" width="15" height="5" rx="2" fill="#f5c33b" stroke="#5a1a14" stroke-width="1.6"/>` +
        `<ellipse cx="0" cy="26" rx="15" ry="14.5" fill="#e2332c" stroke="#5a1a14" stroke-width="2"/>` +
        `<path d="M0 11.5V40.5M-8 12.5Q-12 26 -8 39.5M8 12.5Q12 26 8 39.5" stroke="#a81b1b" stroke-width="1.6" fill="none"/>` +
        `<text x="0" y="31" text-anchor="middle" font-size="14" font-weight="700" fill="#ffd24a" font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">福</text>` +
        `<rect x="-7.5" y="39.5" width="15" height="5" rx="2" fill="#f5c33b" stroke="#5a1a14" stroke-width="1.6"/>` +
        `<path d="M0 44.5V56" stroke="#f5c33b" stroke-width="2"/><path d="M-4.5 56H4.5L3 68H-3Z" fill="#f5c33b" stroke="#a8740a" stroke-width="1.2"/></g></g>`;
    }

    return;
  }
  const cols = ['#ff4d5a', '#ffd84d', '#4cd37b', '#4aa8ff', '#ff8ad8'];

}
/* ---- Tet fireworks: rockets that climb, then burst (peony / ring / willow / double). Drawn above the UI. ---- */
const fwCv = $('#fwc'), fx = fwCv.getContext('2d');
let rockets = [], sparks = [], nextRocket = 0, fwCount = 0, fwLast = 0, fwW = 0, fwH = 0;
const fwColors = () => ['#e8222a', '#ff5a1f', '#d6246e', '#c77d00', '#ffffff', '#7b1fa2', '#e8222a', '#ff9d00'];
const fpick = a => a[(Math.random() * a.length) | 0];
function fwResize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  fwW = innerWidth; fwH = innerHeight;
  fwCv.width = fwW * dpr; fwCv.height = fwH * dpr; fx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function fwTarget() {
  const rc = $('.boardwrap').getBoundingClientRect(), zones = [];
  if (rc.left > 110) zones.push([28, rc.left - 14]);
  if (fwW - rc.right > 110) zones.push([rc.right + 14, fwW - 28]);

  else { x0 = 40; x1 = fwW - 40; rmax = 110; }
  return {x: x0 + Math.random() * Math.max(1, x1 - x0), y: fwH * (.14 + Math.random() * .34), rmax};
}
function launchRocket() {
  const t = fwTarget();
  rockets.push({x0: t.x + (Math.random() - .5) * 60, y0: fwH + 8, tx: t.x, ty: t.y, rmax: t.rmax, t: 0, dur: .8 + Math.random() * .35, c: fpick(fwColors()), trail: []});
}
function fwBurst(x, y, rmax, c1) {
  const kind = Math.random(), c2 = fpick(fwColors());
  const add = (a, v, col, o) => sparks.push({x, y, px: x, py: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: o.max, c: col, g: o.g, d: o.d, w: o.w});
  if (kind < .4) {                                   // peony: dense radial ball in two colours
    for (let i = 0; i < 70; i++) add(i / 70 * 6.2832 + Math.random() * .1, rmax * 2.05 * (.45 + Math.random() * .55), i % 3 ? c1 : c2, {max: 1.1 + Math.random() * .5, g: 40, d: 1.8, w: 2.2});
  } else if (kind < .7) {                            // ring + inner star
    for (let i = 0; i < 48; i++) add(i / 48 * 6.2832, rmax * 2.0, c1, {max: 1.2, g: 30, d: 1.8, w: 2.4});
    for (let i = 0; i < 16; i++) add(i / 16 * 6.2832 + .2, rmax * 1.0, c2, {max: 1, g: 30, d: 1.8, w: 2});
  } else {                                           // willow: long drooping strands
    for (let i = 0; i < 60; i++) add(i / 60 * 6.2832 + Math.random() * .1, rmax * 1.6 * (.5 + Math.random() * .5), '#c77d00', {max: 1.9 + Math.random() * .7, g: 85, d: 1.5, w: 1.8});
    for (let i = 0; i < 20; i++) add(Math.random() * 6.2832, rmax * 1.2 * Math.random(), c1, {max: 1.3, g: 60, d: 1.6, w: 2.4});
  }
  sparks.push({x, y, px: x, py: y, vx: 0, vy: 0, life: 0, max: .25, c: '#ffffff', g: 0, d: 0, w: 14, flash: true});
}
/* ---- "Happy New Year 2027" written in fireworks across the upper sky ---- */
let textShow = null, nextText = 0, wantText = false;
function fwTextNow() { wantText = true; }
function fwTextPoints() {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 560;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '900 128px "Trebuchet MS","Segoe UI",Arial,sans-serif'; g.fillText('Happy New Year', 600, 130);
  g.font = '900 250px "Trebuchet MS","Segoe UI",Arial,sans-serif'; g.fillText('2027', 600, 400);
  const d = g.getImageData(0, 0, 1200, 560).data, step = 8, pts = [];
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (let y = 0; y < 560; y += step) for (let x = 0; x < 1200; x += step) if (d[(y * 1200 + x) * 4 + 3] > 128) {
    pts.push([x, y]); if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  if (!pts.length) return [];
  const w = maxX - minX, h = maxY - minY;
  let sc = Math.min(fwW * .9, 880) / w;
  if (h * sc > fwH * .31) sc = fwH * .31 / h;
  return pts.map(([x, y]) => ({x: (x - (minX + maxX) / 2) * sc, y: (y - (minY + maxY) / 2) * sc}));
}
function startTextShow(now) {
  const pts = fwTextPoints(); if (!pts.length) return;
  const cx = fwW / 2, cy = fwH * .205;
  const cols = ['#ffd24a', '#ffd24a', '#ffd24a', '#fff4c2', '#fff4c2', '#ff9d00', '#ff8fb0'];
  textShow = {t0: now, cx, cy, fired: false, parts: pts.map(p => ({
    tx: cx + p.x, ty: cy + p.y, c: cols[(Math.random() * cols.length) | 0], ph: Math.random() * 6.28,
    sz: 1.5 + Math.random() * .9, dx: (Math.random() - .5) * 40, dy: Math.random() * 20}))};
  for (let k = 0; k < 3; k++) rockets.push({x0: cx + (k - 1) * 150 + (Math.random() - .5) * 40, y0: fwH + 8, tx: cx + (k - 1) * 30, ty: cy, rmax: 0, t: -k * .08, dur: .85, c: '#ffd24a', trail: [], flash: true});
}
function drawTextShow(now) {
  const s = textShow; if (!s) return;
  const T = (now - s.t0) / 1000;
  if (T > 6.9) { textShow = null; return; }
  if (!s.fired && T >= .85) { s.fired = true; sparks.push({x: s.cx, y: s.cy, px: s.cx, py: s.cy, vx: 0, vy: 0, life: 0, max: .4, c: '#fff', g: 0, d: 0, w: 38, flash: true}); }
  if (T < .85) return;
  const tf = T - .85;
  fx.globalCompositeOperation = 'lighter';
  for (const p of s.parts) {
    let x, y, a = 1;
    if (tf < 1.15) {                                    // burst: the sparks fly out from the centre and settle into the letters
      const u = tf / 1.15, e = 1 - Math.pow(1 - u, 3);
      x = s.cx + (p.tx - s.cx) * e + (1 - e) * Math.sin(p.ph * 3 + T * 9) * 16;
      y = s.cy + (p.ty - s.cy) * e + (1 - e) * Math.cos(p.ph * 3 + T * 9) * 16;
      a = .4 + .6 * e;
    } else if (T < 5.3) {                               // hold: the letters glitter
      x = p.tx + Math.sin(T * 3 + p.ph) * .7; y = p.ty + Math.cos(T * 3.3 + p.ph) * .7;
      a = .74 + .26 * Math.sin(T * 7 + p.ph * 5);
    } else {                                            // fade: the embers drift down
      const k = T - 5.3;
      x = p.tx + p.dx * k; y = p.ty + 60 * k * k + p.dy * k; a = 1 - k / 1.5;
    }
    a = Math.max(0, a);
    fx.fillStyle = p.c;
    fx.globalAlpha = a; fx.beginPath(); fx.arc(x, y, p.sz, 0, 6.2832); fx.fill();
    fx.globalAlpha = a * .22; fx.beginPath(); fx.arc(x, y, p.sz * 2.6, 0, 6.2832); fx.fill();
  }
  fx.globalCompositeOperation = 'source-over';
}
function fwFrame(now) {
  requestAnimationFrame(fwFrame);
  const on = S.xmas && S.season === 'tet' && !reduceMotion;
  if (!on) { if (fwLast) { fx.clearRect(0, 0, fwW, fwH); fwLast = 0; rockets = []; sparks = []; nextRocket = 0; textShow = null; nextText = 0; } return; }
  const dt = fwLast ? Math.min(.05, (now - fwLast) / 1000) : 0; fwLast = now;
  if (!nextRocket) nextRocket = now + 400;
  if (now > nextRocket) {
    launchRocket(); fwCount++;
    if (fwCount % 5 === 0) { setTimeout(launchRocket, 220); setTimeout(launchRocket, 460); }   // now and then a volley
    nextRocket = now + (textShow ? 350 + Math.random() * 350 : 700 + Math.random() * 900);
  }
  if (!nextText) nextText = now + 2500;
  if (!textShow && (wantText || now > nextText)) { startTextShow(now); wantText = false; nextText = now + 38000; }
  fx.clearRect(0, 0, fwW, fwH);
  fx.lineCap = 'round';
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.t += dt / r.dur;
    const e = 1 - Math.pow(1 - Math.max(0, Math.min(1, r.t)), 2);
    const x = r.x0 + (r.tx - r.x0) * e + Math.sin(r.t * 14) * 2, y = r.y0 + (r.ty - r.y0) * e;
    r.trail.push([x, y]); if (r.trail.length > 14) r.trail.shift();
    for (let k = 1; k < r.trail.length; k++) {
      fx.globalAlpha = k / r.trail.length * .85; fx.strokeStyle = '#ffb02e'; fx.lineWidth = 2.6 * k / r.trail.length + .6;
      fx.beginPath(); fx.moveTo(r.trail[k - 1][0], r.trail[k - 1][1]); fx.lineTo(r.trail[k][0], r.trail[k][1]); fx.stroke();
    }
    fx.globalAlpha = 1; fx.fillStyle = '#fff'; fx.beginPath(); fx.arc(x, y, 2.4, 0, 6.2832); fx.fill();
    if (r.t >= 1) {
      if (r.flash) sparks.push({x: r.tx, y: r.ty, px: r.tx, py: r.ty, vx: 0, vy: 0, life: 0, max: .3, c: '#fff', g: 0, d: 0, w: 10, flash: true}); else fwBurst(r.tx, r.ty, r.rmax, r.c);

  for (let i = sparks.length - 1; i >= 0; i--) {

    const a = 1 - p.life / p.max;
    if (p.flash) { fx.globalAlpha = a * .8; fx.fillStyle = '#fff'; fx.beginPath(); fx.arc(p.x, p.y, p.w * (1.6 - a), 0, 6.2832); fx.fill(); continue; }

    p.vx *= 1 - p.d * dt; p.vy = p.vy * (1 - p.d * dt) + p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;

    fx.beginPath(); fx.moveTo(p.px, p.py); fx.lineTo(p.x, p.y); fx.stroke();
  }

  fx.globalAlpha = 1;
}
window.addEventListener('resize', fwResize);
fwResize(); requestAnimationFrame(fwFrame);

window.addEventListener('resize', snowResize);
snowResize(); requestAnimationFrame(snowFrame);

// test hooks
window.__ttt = {get G() { return G; }, get net() { return net; }, aiMove, cfgOf, S, doMove, newRound, fw: {burst: fwBurst, launch: launchRocket, text: fwTextNow, get show() { return !!textShow; }, get points() { return textShow ? textShow.parts.length : 0; }, get sparks() { return sparks.length; }, get rockets() { return rockets.length; }}};

syncUI();
newRound();
(function initOnline() {
  const room = new URLSearchParams(location.search).get('room');
  if (room) { S.opp = 'online'; syncUI(); newRound(); netConnect(() => netSend({t:'join', code:room.toUpperCase().slice(0, 4)})); }
  else if (online()) netConnect();
})();
})();
